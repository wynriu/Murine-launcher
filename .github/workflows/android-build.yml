name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AOSP Quickstep debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Quickstep debug APK
        run: gradle --no-daemon --stacktrace assembleAospWithQuickstepDebug

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: murine-launcher-apks
          path: |
            app/build/outputs/apk/**/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: ignore
